name: CI

on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Resolve backend origin
              env:
                  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
              run: |
                  if [[ -z "${PUBLIC_BASE_URL}" ]]; then
                      echo 'Set the PUBLIC_BASE_URL repository variable to the backend origin.' >&2
                      exit 1
                  fi
                  echo "TOPSKIP_SERVER_ORIGIN=${PUBLIC_BASE_URL}" >> "${GITHUB_ENV}"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Build
              run: pnpm run build

            - name: Validate development extension manifest
              run: |
                  pnpm run validate:extension-manifest -- \
                      --build dev \
                      --server-origin "${TOPSKIP_SERVER_ORIGIN}" \
                      --manifest extension/dist/manifest.json

            - name: Deployment asset tests
              run: pnpm run test:deployment

            - name: Production container smoke
              run: pnpm run test:container

            - name: Unit tests
              run: pnpm run test

            - name: Coverage
              run: pnpm run test:coverage

            - name: Install Playwright Chromium
              run: pnpm exec playwright install chromium --with-deps

            - name: E2E tests
              run: pnpm run test:e2e

            - name: Validate release packaging boundary
              run: |
                  pnpm run beta
                  pnpm run validate:extension-manifest -- \
                      --build beta \
                      --server-origin "${TOPSKIP_SERVER_ORIGIN}" \
                      --manifest extension/dist/manifest.json
                  pnpm run release
                  pnpm run validate:extension-manifest -- \
                      --build release \
                      --server-origin "${TOPSKIP_SERVER_ORIGIN}" \
                      --manifest extension/dist/manifest.json
                  if find extension/dist -type f -name '*.map' -print -quit | grep --quiet .; then
                      echo 'Release package must not contain source maps.' >&2
                      exit 1
                  fi
                  if grep --recursive --extended-regexp --files-with-matches \
                      '127\.0\.0\.1:(8787|4173)' extension/dist; then
                      echo 'Release package contains a development endpoint.' >&2
                      exit 1
                  fi
                  if grep --recursive --fixed-strings --files-with-matches \
                      --regexp='--- Raw assistant message' \
                      --regexp='--- chunkText (user message) ---' \
                      --regexp='more segment(s); chunked below' \
                      extension/dist; then
                      echo 'Release package contains transcript-bearing developer logs.' >&2
                      exit 1
                  fi
